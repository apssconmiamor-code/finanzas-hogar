name = "finanzas-hogar-token"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true
preview_urls = false

# El GOOGLE_CLIENT_ID no es secreto (ya es público en config.js del
# frontend) — los verdaderos secretos (GOOGLE_CLIENT_SECRET,
# WORKER_SESSION_SECRET) se configuran aparte con `wrangler secret put`,
# nunca acá en texto plano.
[vars]
GOOGLE_CLIENT_ID = "610428004631-cmp0hujrbltla9b9j03vfa8ih47dulsj.apps.googleusercontent.com"
ALLOWED_ORIGIN = "https://apssconmiamor-code.github.io"
# Mismo ID que SPREADSHEET_ID en config.js del frontend — el Worker lo
# necesita para leer/escribir la hoja "Notificaciones" por su cuenta desde
# el Cron Trigger, sin depender de que haya alguien con la app abierta.
SPREADSHEET_ID = "1g2pyTgEc-BQ1mv2wr91klk58oy1L-2CRIJb9BoLGk6o"
# Clave pública VAPID (identifica a esta app ante los navegadores para Web
# Push) — no es secreta, viaja igual al frontend. La privada se guarda
# aparte con `wrangler secret put VAPID_PRIVATE_KEY`.
VAPID_PUBLIC_KEY = "BBaO4zGUoUgNSwZo-yOurnDy_eZqgIAeGbdzdI6J70ELt2Iut8PVjD-bjNlFTGsiVu1dgiL2unG4322J3vB7ur0"

[[kv_namespaces]]
binding = "REFRESH_TOKENS"
id = "9c0034ced7004e4d8831871bcfb1f95d"

[[kv_namespaces]]
binding = "PUSH_SUBS"
id = "a80bd8dd6a8a4b98b3b9c4d6c34aa4a9"

[triggers]
# Revisa la hoja "Notificaciones" cada 5 minutos y manda los push que ya
# vencieron. Cloudflare Cron Triggers usan sintaxis crontab en UTC.
crons = ["*/5 * * * *"]

[observability]
enabled = true
